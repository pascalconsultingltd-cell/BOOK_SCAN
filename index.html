<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Book Scan</title>
<style>
:root{--bg:#111;--fg:#eee;--acc:#2a7;--bad:#c33}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px system-ui,sans-serif}
header{display:flex;gap:6px;padding:8px;flex-wrap:wrap;align-items:center}
button,select,input{font:inherit}button{background:#333;color:var(--fg);border:0;border-radius:8px;padding:10px 14px}
button.on{background:var(--acc)}#n{margin-left:auto;font-weight:bold}
#stage{position:relative;background:#000;width:fit-content;margin:auto}video{display:block;max-width:100%;max-height:75vh;min-height:120px}
#crop{position:absolute;border:2px solid #0f0;pointer-events:none}#mid{position:absolute;top:0;bottom:0;border-left:2px dashed #0f0;pointer-events:none}
#status{position:absolute;top:6px;left:6px;background:#000b;padding:4px 8px;border-radius:6px}
#flash{position:absolute;inset:0;background:#fff;opacity:0;transition:opacity .4s;pointer-events:none}
#meter{height:6px;background:#333;position:relative}#meter div{height:100%;background:var(--acc);width:0}#meter i{position:absolute;top:0;bottom:0;border-left:2px solid #fff}
details{padding:4px 8px}summary{padding:6px 0}label{display:flex;gap:8px;align-items:center;margin:6px 0}label input[type=range]{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:6px;padding:8px}
.grid figure{margin:0;position:relative}.grid img{width:100%;display:block}
.grid figcaption{position:absolute;top:0;left:0;background:#000b;padding:0 5px}.grid .off img{opacity:.25}#ex{padding:0 8px}
</style></head><body>
<div id="scan"><header>
<select id="cam" data-k="cam"><option value="user">Front cam</option><option value="environment">Back cam</option></select><button id="go">Start camera</button><button id="auto">Auto</button><button id="snap">Snap</button><button id="toexp">Export…</button><span id="n">0</span>
</header>
<div id="stage"><video id="v" playsinline muted></video><div id="crop"></div><div id="mid"></div><div id="status">Press Start camera</div><div id="flash"></div></div>
<div id="meter"><div></div><i></i></div>
<details><summary>Crop / detection</summary>
<label>Top <input type="range" data-k="top" min="0" max="45"></label>
<label>Bottom <input type="range" data-k="bottom" min="0" max="45"></label>
<label>Left <input type="range" data-k="left" min="0" max="45"></label>
<label>Right <input type="range" data-k="right" min="0" max="45"></label>
<label><input type="checkbox" data-k="split"> Split into 2 pages, gutter at <input type="range" data-k="mid" min="20" max="80"></label>
<button id="fit">Fit to book now</button> (Auto refits on every photo)
<label>Motion threshold % <input type="range" data-k="sens" min="1" max="30"></label>
<label>Still for (s) <input type="range" data-k="still" min="0.4" max="4" step="0.2"></label>
</details>
<div id="thumbs" class="grid"></div></div>
<div id="ex" hidden><header><button id="back">◀ Camera</button><b>Export HTML</b></header>
<label>Title <input data-k="title"></label>
<label><input type="checkbox" data-k="clean"> Remove shadows (hand, phone)</label>
<label><input type="checkbox" data-k="txt"> OCR text (slow, rough), language <select data-k="lang"><option>eng</option><option>fra</option><option value="eng+fra">eng+fra</option><option>deu</option><option>spa</option><option>ita</option></select></label>
<label><input type="checkbox" data-k="img"> With OCR: keep pictures beside text</label>
<header><button id="all">All</button><button id="none">None</button><button id="exp" class="on">Export</button><span id="prog"></span></header>
<div id="pick" class="grid"></div>
<p><button id="clr" style="background:var(--bad)">Delete all spreads</button></p></div>
<script>
const $=id=>document.getElementById(id), v=$('v'), st=$('status');
const cfg={cam:'user',top:3,bottom:3,left:3,right:3,split:true,mid:50,sens:6,still:1.2,title:'book',img:true,txt:false,clean:true,lang:'eng',v:2};
try{const o=JSON.parse(localStorage.bookscan||'{}');if(o.v!=2)Object.assign(o,{txt:false,clean:true,v:2});Object.assign(cfg,o)}catch{}
const save=()=>{try{localStorage.bookscan=JSON.stringify(cfg)}catch{};draw()},sync=()=>document.querySelectorAll('[data-k]').forEach(e=>e.type=='checkbox'?e.checked=cfg[e.dataset.k]:e.value=cfg[e.dataset.k]);
document.querySelectorAll('[data-k]').forEach(e=>{const k=e.dataset.k,ck=e.type=='checkbox';e.oninput=()=>{cfg[k]=ck?e.checked:e.type=='range'?+e.value:e.value;save()}});sync();
function draw(){Object.assign($('crop').style,{top:cfg.top+'%',bottom:cfg.bottom+'%',left:cfg.left+'%',right:cfg.right+'%'});
 $('mid').style.left=cfg.mid+'%';$('mid').style.display=cfg.split?'':'none';$('meter').querySelector('i').style.left=cfg.sens*4+'%'}
draw();
// pages persist in IndexedDB so a reload does not lose the scan
let db,pages=[];const req=r=>new Promise((ok,ko)=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error)}),store=m=>db.transaction('pages',m).objectStore('pages');
const open=indexedDB.open('bookscan',1);open.onupgradeneeded=()=>open.result.createObjectStore('pages',{keyPath:'id',autoIncrement:true});
open.onsuccess=async()=>{db=open.result;(await req(store('readonly').getAll())).forEach(thumb);renum()};
function thumb(p){pages.push(p);const f=document.createElement('figure');f.innerHTML=`<img src="${p.url=URL.createObjectURL(p.blob)}"><figcaption>${pages.length}</figcaption>`;
 f.onclick=async()=>{if(!confirm('Delete this spread?'))return;await req(store('readwrite').delete(p.id));pages.splice(pages.indexOf(p),1);f.remove();renum()};
 $('thumbs').prepend(f);renum()}
function renum(){$('n').textContent=pages.length+' spreads';[...$('thumbs').children].forEach((f,i,a)=>f.lastChild.textContent=a.length-i)}
let ac,timer,ref,sel=new Set(),auto=false,state='turn',stillSince=0,last=0,prev;
function beep(){const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=1200;g.gain.value=.3;o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+.15);navigator.vibrate?.(80)}
// fit crop + gutter to the book: bright blobs (paper, above Otsu threshold) at least 30% of the biggest, merged (gutter may split them); gutter = darkest column near its middle
function fit(src){const w=160,h=Math.round(w*(src.videoHeight||src.height)/(src.videoWidth||src.width)),k=document.createElement('canvas');k.width=w;k.height=h;
 const x=k.getContext('2d',{willReadFrequently:true});x.drawImage(src,0,0,w,h);const d=x.getImageData(0,0,w,h).data,N=w*h,g=new Uint8Array(N),hs=new Array(256).fill(0);
 for(let i=0;i<N;i++){g[i]=(d[i*4]+d[i*4+1]+d[i*4+2])/3;hs[g[i]]++}
 let all=0,sB=0,wB=0,best=0,t=128;hs.forEach((c,i)=>all+=c*i);for(let i=0;i<256;i++){wB+=hs[i];if(!wB||wB==N)continue;sB+=i*hs[i];const b=wB*(N-wB)*(sB/wB-(all-sB)/(N-wB))**2;if(b>best){best=b;t=i}}
 const seen=new Uint8Array(N),blobs=[];
 for(let i=0;i<N;i++)if(g[i]>t&&!seen[i]){const st=[i],b=[w,h,0,0];let n=0;seen[i]=1;
  while(st.length){const j=st.pop(),px=j%w,py=(j-px)/w;n++;b[0]=Math.min(b[0],px);b[1]=Math.min(b[1],py);b[2]=Math.max(b[2],px);b[3]=Math.max(b[3],py);
   for(const q of [px>0&&j-1,px<w-1&&j+1,j-w,j+w])if(q!==false&&q>=0&&q<N&&g[q]>t&&!seen[q]){seen[q]=1;st.push(q)}}
  blobs.push([n,b])}
 const top=Math.max(0,...blobs.map(b=>b[0])),bb=blobs.filter(b=>b[0]>top*.3).map(b=>b[1]).reduce((a,b)=>[Math.min(a[0],b[0]),Math.min(a[1],b[1]),Math.max(a[2],b[2]),Math.max(a[3],b[3])],[w,h,0,0]);
 if(top<N*.1)return null;
 // only one page found (not wider than tall): the other page is on the brighter side, mirror the box across that edge
 let gx;if(bb[2]-bb[0]<(bb[3]-bb[1])*1.1){const pw=bb[2]-bb[0],side=o=>{let m=0;o=Math.max(0,Math.min(w-1,o));for(let py=bb[1];py<=bb[3];py++)m+=g[py*w+o];return m};
  if(side(bb[2]+4)>side(bb[0]-4)){gx=bb[2];bb[2]=Math.min(w-1,bb[2]+pw)}else{gx=bb[0];bb[0]=Math.max(0,bb[0]-pw)}}
 const c=v=>Math.max(0,Math.min(45,Math.round(v))),r={left:c(bb[0]/w*100-1),top:c(bb[1]/h*100-1),right:c((w-1-bb[2])/w*100-1),bottom:c((h-1-bb[3])/h*100-1)};
 r.touch=(bb[0]<=0)+(bb[1]<=0)+(bb[2]>=w-1)+(bb[3]>=h-1);
 if(gx==null){let gm=1e9;for(let px=Math.round(bb[0]+(bb[2]-bb[0])*.35);px<=bb[0]+(bb[2]-bb[0])*.65;px++){let m=0;for(let py=bb[1];py<=bb[3];py++)for(let q=-1;q<=1;q++)m+=g[py*w+px+q];if(m<gm){gm=m;gx=px}}}
 r.mid=Math.max(20,Math.min(80,Math.round(gx/w*100)));return r}
const show=r=>{Object.assign(cfg,{left:r.left,top:r.top,right:r.right,bottom:r.bottom,mid:r.mid});sync();save()};
$('fit').onclick=()=>{const r=v.videoWidth&&fit(v);r?show(r):say('Book not found',3000)};
let hold=0;const say=(t,ms)=>{if(ms)hold=Date.now()+ms;else if(Date.now()<hold)return;st.textContent=t};
function warn(t){say(t,2500);const o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=220;g.gain.value=.15;o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+.5);navigator.vibrate?.([200,100,200])}
// auto: refit the box to the book in every photo; refuse photos where the book is cut off by the frame
function snap(manual){if(!v.videoWidth)return;const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);
 const r=fit(c);
 if(!manual){if(!r||r.touch&&r.touch<4){state='turn';return warn(r?'Book cut off: move it fully into view':'Book not found')}
}
 if(r)show(r);const crop=r&&{left:r.left,top:r.top,right:r.right,bottom:r.bottom,mid:r.mid};
 beep();$('flash').style.transition='none';$('flash').style.opacity=.7;requestAnimationFrame(()=>{$('flash').style.transition='';$('flash').style.opacity=0});
 last=Date.now();c.toBlob(async blob=>{const id=await req(store('readwrite').add({blob,crop}));thumb({id,blob,crop})},'image/jpeg',.92)}
// front cam default: you see the book in the preview while turning pages
async function cam(){v.srcObject?.getTracks().forEach(t=>t.stop());prev=null;
 try{v.srcObject=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:cfg.cam,width:{ideal:4096},height:{ideal:2160}}});await v.play();st.textContent=v.videoWidth+'x'+v.videoHeight+' ready';return true}
 catch(e){st.textContent='Camera error: '+e.message+(isSecureContext?'':' (needs https)')}}
$('cam').onchange=()=>v.srcObject&&cam();
$('go').onclick=async()=>{ac=ac||new AudioContext();ac.resume();if(!await cam())return;
 try{await navigator.wakeLock.request('screen')}catch{}
 $('go').style.display='none';timer=setInterval(watch,150)};
$('auto').onclick=()=>{auto=!auto;$('auto').classList.toggle('on',auto);state='turn';stillSince=0};
$('snap').onclick=v.onclick=()=>{ac&&snap(true)};
// motion: mean grey diff of a tiny frame; wait for movement (page turn), then stillness, then snap
const sm=document.createElement('canvas');sm.width=80;sm.height=60;const sx=sm.getContext('2d',{willReadFrequently:true});
// motion = % of a tiny frame's pixels changed by >16 grey levels; ignores noise, catches a slow hand
const chg=(a,b)=>{let n=0;for(let i=0;i<4800;i++)if(Math.abs(a[i]-b[i])>16)n++;return n/48};
function watch(){if(!v.videoWidth)return;sx.drawImage(v,0,0,80,60);const d=sx.getImageData(0,0,80,60).data,g=new Uint8Array(4800);
 for(let i=0;i<4800;i++)g[i]=(d[i*4]+d[i*4+1]+d[i*4+2])/3;const m=prev?chg(g,prev):0;prev=g;
 $('meter').firstChild.style.width=Math.min(100,m*2)+'%';if(!auto)return;const now=Date.now();
 if(state=='turn'){say('Turn page / show book');if(m>cfg.sens*2&&now-last>800){state='wait';stillSince=0}}
 // still = almost nothing changes frame to frame AND since the hold began (slow moves add up)
 else if(m<cfg.sens/3){if(!stillSince||chg(g,ref)>cfg.sens/4){stillSince=now;ref=g}say('Hold still…');if(now-stillSince>cfg.still*1000){state='turn';snap()}}
 else{stillSince=0;say('Moving')}}
// crop + split one spread into page canvases
async function cut({blob,crop:k=cfg}){const b=await createImageBitmap(blob),W=b.width,H=b.height,x0=W*k.left/100,x1=W*(1-k.right/100),y0=H*k.top/100,y1=H*(1-k.bottom/100);
 const m=Math.min(x1-1,Math.max(x0+1,W*k.mid/100));
 return (cfg.split?[[x0,m],[m,x1]]:[[x0,x1]]).map(([a,z])=>{const c=document.createElement('canvas');c.width=z-a;c.height=y1-y0;c.getContext('2d').drawImage(b,a,y0,z-a,y1-y0,0,0,z-a,y1-y0);return c})}
// layout: pass 1 finds confident words, grid-dilated into text zones (split where the left edge jumps); pass 2 reads each zone alone; the rest stays picture
// shadow removal: divide by paper brightness (90th percentile luma per block of a 64-wide grid, smoothly upscaled); dark areas (table, figures) left alone
function clean(c){const W=c.width,H=c.height,gw=64,gh=Math.max(1,Math.round(gw*H/W)),x=c.getContext('2d'),im=x.getImageData(0,0,W,H),d=im.data,s=document.createElement('canvas');s.width=gw;s.height=gh;
 const sx=s.getContext('2d'),g=sx.createImageData(gw,gh);
 for(let by=0;by<gh;by++)for(let bx=0;bx<gw;bx++){const hs=new Uint32Array(256);let n=0;
  for(let y=by*H/gh|0;y<(by+1)*H/gh;y+=2)for(let i=y*W+(bx*W/gw|0);i<y*W+(bx+1)*W/gw;i+=2){hs[(d[i*4]*.3+d[i*4+1]*.59+d[i*4+2]*.11)|0]++;n++}
  let k=255,acc=0;while(k>0&&(acc+=hs[k])<n*.1)k--;const j=(by*gw+bx)*4;g.data[j]=g.data[j+1]=g.data[j+2]=Math.max(k,20);g.data[j+3]=255}
 sx.putImageData(g,0,0);const b=document.createElement('canvas');b.width=W;b.height=H;const bxx=b.getContext('2d');bxx.imageSmoothingQuality='high';bxx.drawImage(s,0,0,W,H);
 const bg=bxx.getImageData(0,0,W,H).data;for(let i=0;i<d.length;i+=4){const p=bg[i],f=1+(270/p-1)*Math.max(0,Math.min(1,(p-70)/50));d[i]=Math.min(255,d[i]*f);d[i+1]=Math.min(255,d[i+1]*f);d[i+2]=Math.min(255,d[i+2]*f)}
 const o=document.createElement('canvas');o.width=W;o.height=H;o.getContext('2d').putImageData(im,0,0);return o}
// blank page: almost no sharp edges (text ~18%, figures ~2%, blank with show-through ~0.1%), 5% border ignored
function blank(c){const w=c.width,h=c.height,d=c.getContext('2d').getImageData(0,0,w,h).data,g=i=>d[i*4]+d[i*4+1]+d[i*4+2];let n=0,t=0;
 for(let y=h*.05|0;y<h*.95;y++)for(let i=y*w+(w*.05|0);i<y*w+w*.95;i++){t++;if(Math.abs(4*g(i)-g(i-1)-g(i+1)-g(i-w)-g(i+w))>60)n++}return n/t<.01}
const med=a=>a.sort((x,y)=>x-y)[a.length>>1];
function crop(c,x0,y0,x1,y1){const k=document.createElement('canvas');k.width=x1-x0;k.height=y1-y0;const x=k.getContext('2d');x.drawImage(c,x0,y0,k.width,k.height,0,0,k.width,k.height);
 const d=x.getImageData(0,0,k.width,k.height).data;let n=0,s=0,q=0;for(let i=0;i<d.length;i+=40){const g=(d[i]+d[i+1]+d[i+2])/3;n++;s+=g;q+=g*g}
 return Math.sqrt(q/n-(s/n)**2)<12?'':`<img src="${k.toDataURL('image/jpeg',.8)}">`}
// grey divided by blurred background: removes shadows so OCR thresholds evenly
function flat(c){const W=c.width,H=c.height,mk=(w,h)=>{const k=document.createElement('canvas');k.width=w;k.height=h;return k},s=mk(Math.ceil(W/24),Math.ceil(H/24)),o=mk(W,H),bg=mk(W,H);
 s.getContext('2d').drawImage(c,0,0,s.width,s.height);const bx=bg.getContext('2d'),ox=o.getContext('2d');bx.imageSmoothingQuality='high';bx.drawImage(s,0,0,W,H);ox.drawImage(c,0,0);
 const a=ox.getImageData(0,0,W,H),d=a.data,b=bx.getImageData(0,0,W,H).data;
 for(let i=0;i<d.length;i+=4)d[i]=d[i+1]=d[i+2]=Math.min(255,(d[i]+d[i+1]+d[i+2])/((b[i]+b[i+1]+b[i+2])||1)*235);ox.putImageData(a,0,0);return o}
function rot(c,a){const k=document.createElement('canvas'),W=k.width=c.width,H=k.height=c.height,x=k.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,W,H);x.translate(W/2,H/2);x.rotate(a);x.drawImage(c,-W/2,-H/2);return k}
async function layout(w,c,img){let f=flat(c),d=(await w.recognize(f,{},{blocks:true})).data;const lin=()=>d.blocks.flatMap(b=>b.paragraphs.flatMap(p=>p.lines));
 // deskew: median slope of confident long baselines
 const a=med(lin().filter(l=>l.confidence>=80&&l.baseline.x1-l.baseline.x0>c.width*.15).map(l=>Math.atan2(l.baseline.y1-l.baseline.y0,l.baseline.x1-l.baseline.x0)))||0;
 if(Math.abs(a)>.035){c=rot(c,-a);f=flat(c);d=(await w.recognize(f,{},{blocks:true})).data}
 const W=c.width,H=c.height,words=lin().flatMap(l=>l.words);
 let good=words.filter(x=>x.confidence>=80&&/[a-z]{3}/i.test(x.text));const h=med(good.map(x=>x.bbox.y1-x.bbox.y0))||20;good=good.filter(x=>(x.bbox.y1-x.bbox.y0)<h*2);
 const s=h/2,gw=Math.ceil(W/s),gh=Math.ceil(H/s),g=new Uint8Array(gw*gh),seen=new Uint8Array(gw*gh),segs=[];
 good.forEach(({bbox:b})=>{for(let y=Math.max(0,(b.y0/s|0)-1);y<=Math.min(gh-1,(b.y1/s|0)+1);y++)for(let x=Math.max(0,(b.x0/s|0)-3);x<=Math.min(gw-1,(b.x1/s|0)+3);x++)g[y*gw+x]=1});
 for(let i=0;i<g.length;i++)if(g[i]&&!seen[i]){const st=[i],rows={};seen[i]=1;
  while(st.length){const j=st.pop(),x=j%gw,y=(j-x)/gw,r=rows[y]||(rows[y]=[x,x]);r[0]=Math.min(r[0],x);r[1]=Math.max(r[1],x);
   for(const k of [x>0&&j-1,x<gw-1&&j+1,j-gw,j+gw])if(k!==false&&k>=0&&k<g.length&&g[k]&&!seen[k]){seen[k]=1;st.push(k)}}
  let cur;Object.keys(rows).map(Number).sort((a,b)=>a-b).forEach(y=>{const[a,b]=rows[y];
   if(cur&&y==cur.y1+1&&Math.abs(a-cur.x0)<gw*.08){cur.x0=Math.min(cur.x0,a);cur.x1=Math.max(cur.x1,b);cur.y1=y}else segs.push(cur={x0:a,x1:b,y0:y,y1:y})})}
 const zones=segs.map(z=>({x0:z.x0*s,y0:z.y0*s,x1:Math.min(W,(z.x1+1)*s),y1:Math.min(H,(z.y1+1)*s)}))
  .filter(z=>good.filter(({bbox:b})=>(b.x0+b.x1)/2>z.x0&&(b.x0+b.x1)/2<z.x1&&(b.y0+b.y1)/2>z.y0&&(b.y0+b.y1)/2<z.y1).length>=3).sort((a,b)=>a.y0-b.y0);
 if(!zones.length)return img?crop(c,0,0,W,H)||'':'';
 const rows=[];zones.forEach(z=>{const r=rows.at(-1);r&&Math.min(z.y1,r.y1)-z.y0>Math.min(z.y1-z.y0,r.y1-r.y0)/2?(r.z.push(z),r.y1=Math.max(r.y1,z.y1)):rows.push({y0:z.y0,y1:z.y1,z:[z]})});
 let out='',y=0;const pct=a=>(a/W*100).toFixed(1)+'%';
 for(const r of rows){if(img&&r.y0-y>H*.04)out+=crop(c,0,y,W,r.y0);let x=0,cells='';
  for(const z of r.z.sort((a,b)=>a.x0-b.x0)){if(img&&z.x0-x>W*.1){const p=crop(c,x,r.y0,z.x0,r.y1);if(p)cells+=`<div style="flex:0 1 ${pct(z.x0-x)}">${p}</div>`}
   const lines=(await w.recognize(f,{rectangle:{left:z.x0|0,top:z.y0|0,width:z.x1-z.x0|0,height:z.y1-z.y0|0}},{blocks:true})).data.blocks.flatMap(b=>b.paragraphs)
    .map(p=>p.lines.filter(l=>l.confidence>=60).map(l=>{const t=esc(l.text.trim());return l.bbox.x1>z.x1-(z.x1-z.x0)*.12?(t.endsWith('-')?t.slice(0,-1)+'\u0001':t+' '):t+'<br>'}).join('').replace(/\u0001/g,'').replace(/<br>$/,''));
   cells+=`<div class="t">${lines.filter(Boolean).map(t=>`<p>${t}</p>`).join('')}</div>`;x=Math.max(x,z.x1)}
  if(img&&W-x>W*.1){const p=crop(c,x,r.y0,W,r.y1);if(p)cells+=`<div style="flex:0 1 ${pct(W-x)}">${p}</div>`}
  out+=`<div class="row">${cells}</div>`;y=r.y1}
 if(img&&H-y>H*.04)out+=crop(c,0,y,W,H);return out}

function mark(){[...$('pick').children].forEach((f,i)=>f.className=sel.has(pages[i].id)?'':'off');$('exp').textContent=`Export ${sel.size} spread${sel.size==1?'':'s'}`}
$('toexp').onclick=()=>{v.srcObject?.getTracks().forEach(t=>t.stop());v.srcObject=null;clearInterval(timer);auto=false;$('auto').classList.remove('on');$('go').style.display='';st.textContent='Press Start camera';

$('back').onclick=()=>{$('ex').hidden=true;$('scan').hidden=false};

const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const load=src=>new Promise((ok,ko)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=ko;document.head.append(s)});
$('exp').onclick=async()=>{const todo=pages.filter(p=>sel.has(p.id));if(!todo.length)return alert('No spreads selected');

 try{if(cfg.txt){pr.textContent='Loading OCR…';window.Tesseract||await load('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js');w=await Tesseract.createWorker(cfg.lang)}
  for(const [i,p] of todo.entries())for(let c of await cut(p)){if(cfg.clean)c=clean(c);if(blank(c)){skip++;continue}pr.textContent=`Spread ${i+1}/${todo.length}, page ${++n}`;body+=`<section id="p${n}"><h2>Page ${n}</h2>`;
   body+=(w?await layout(w,c,cfg.img):`<img src="${c.toDataURL('image/jpeg',.8)}" alt="Page ${n}">`)+'</section>\n'}
  const html=`<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(cfg.title)}</title>
<style>body{max-width:60em;margin:auto;padding:1em;font:18px/1.6 Georgia,serif}img{max-width:100%;display:block;margin:.5em 0}.row{display:flex;gap:1em;align-items:flex-start}.row>div{min-width:0}.t{flex:1 1 0;min-width:50%!important}h2{font:12px sans-serif;color:#888;border-top:1px solid #ddd;padding-top:1em}
img.big{position:fixed;inset:0;width:100%;height:100%;max-width:none;margin:0;object-fit:contain;background:#000e;z-index:9}</style></head>
<body onclick="event.target.tagName=='IMG'&&event.target.classList.toggle('big')"><h1>${esc(cfg.title)}</h1>\n${body}</body></html>`;
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download=cfg.title.replace(/[^\w-]+/g,'_')+'.html';a.click();pr.textContent=`Done: ${n} pages`+(skip?`, ${skip} blank skipped`:'');beep();setTimeout(beep,300);setTimeout(beep,600)}
 catch(e){pr.textContent='Export failed: '+e.message}
 finally{w&&w.terminate();b.disabled=false}};
